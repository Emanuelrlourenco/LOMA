<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LOMA — Agenda, dia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17165C}a:hover{color:#0B0A3A}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2FA; color: #17165C; font-family: 'Outfit', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Nov, 2026</h1>
    <button aria-label="Novo atendimento" style="width: 42px; height: 42px; border: 1.5px solid #17165C; border-radius: 21px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <nav aria-label="Visualização" style="display: flex; gap: 4px; margin: 12px 16px 0; padding: 4px; background: #E7E4F8; border-radius: 22px">
    <button aria-pressed="true" style="flex: 1; height: 34px; border: 0; border-radius: 17px; background: #17165C; color: #5ED6B4; font-size: 13px; font-weight: 700; cursor: pointer">Dia</button>
    <button style="flex: 1.3; height: 34px; border: 0; border-radius: 17px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer">Semana</button>
    <button style="flex: 1; height: 34px; border: 0; border-radius: 17px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer">Mês</button>
    <button style="flex: 1; height: 34px; border: 0; border-radius: 17px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer">Ano</button>
    <button style="flex: 1; height: 34px; border: 0; border-radius: 17px; background: transparent; font-size: 13px; font-weight: 600; cursor: pointer">Lista</button>
  </nav>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; padding: 12px 16px 0">
    <sc-for list="{{strip}}" as="s" hint-placeholder-count="6">
      <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
        <button aria-pressed="true" style="height: 62px; border: 0; border-radius: 16px; background: #17165C; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
          <span style="font-size: 13px; font-weight: 600; color: #5ED6B4">{{s.wd}}</span>
          <span style="font-size: 20px; font-weight: 800">{{s.d}}</span>
        </button>
      </sc-if>
      <sc-if value="{{s.off}}" hint-placeholder-val="{{true}}">
        <button style="height: 62px; border: 0; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
          <span style="font-size: 13px; font-weight: 500; color: #5B5A7A">{{s.wd}}</span>
          <span style="font-size: 20px; font-weight: 700">{{s.d}}</span>
        </button>
      </sc-if>
    </sc-for>
  </div>

  <div style="position: relative; margin: 14px 16px 0; height: 548px">
    <div style="position: absolute; left: 0; top: 0; width: 52px; display: flex; flex-direction: column">
      <sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
        <span style="height: 52px; font-size: 12px; font-weight: 500; color: #5B5A7A; line-height: 12px">{{h}}</span>
      </sc-for>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 58px; top: 0; bottom: 0; width: 1.5px; background: #D9D6EE"></div>
    <div aria-label="Agora, 09:00" style="position: absolute; left: 52px; right: 0; top: 52px; display: flex; align-items: center">
      <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF7A66"></span>
      <span style="flex: 1; height: 2px; background: #FF7A66"></span>
    </div>

    <a href="T-Cliente.dc.html" style="position: absolute; left: 70px; right: 0; top: 104px; height: 50px; box-sizing: border-box; border-radius: 16px; background: #5ED6B4; color: #0B3A2E; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; text-decoration: none">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">Bianca Lima · Escova</span><span style="font-size: 12px">10:00 – 11:00</span></span>
      <span style="font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Concluído</span>
    </a>

    <a href="T-Atendimento.dc.html" style="position: absolute; left: 70px; right: 0; top: 260px; height: 128px; box-sizing: border-box; border-radius: 20px; background: #B69CF2; color: #17165C; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 800">Maria Souza</span>
        <span style="font-size: 13px">Coloração + escova · 2h30</span>
      </span>
      <span style="display: flex; justify-content: space-between; align-items: center">
        <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center">Não confirmada</span>
        <span style="font-size: 13px; font-weight: 700">13:00 – 15:30 · R$ 250</span>
      </span>
    </a>

    <div style="position: absolute; left: 70px; right: 0; top: 416px; height: 64px; box-sizing: border-box; border-radius: 18px; background: #17165C; color: #FFFFFF; padding: 9px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 800">Lorena Dias</span><span style="font-size: 12px; color: #C9C6F0">Manicure e pedicure</span></span>
      <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 12px; font-weight: 700; color: #5ED6B4">Confirmada</span><span style="font-size: 12px; color: #C9C6F0">16:00 – 17:15</span></span>
    </div>

    <div style="position: absolute; left: 70px; right: 0; top: 494px; height: 50px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed #8F8CB8; background: #FFFFFF; padding: 7px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Dentista</span><span style="font-size: 12px; color: #5B5A7A">Pessoal · Google Agenda</span></span>
      <span style="font-size: 12px; color: #5B5A7A">17:30 – 18:30</span>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -4px 20px rgba(23,22,92,0.07); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 6px 16px; box-sizing: border-box">
    <a href="T-Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Início</span>
    </a>
    <a href="T-Agenda.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #17165C">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #17165C; color: #5ED6B4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>
      <span style="font-size: 12px; font-weight: 700">Agenda</span>
    </a>
    <a href="T-Cliente.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Clientes</span>
    </a>
    <a href="T-Fin-Geral.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Financeiro</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const strip = [['Ter', '17'], ['Qua', '18'], ['Qui', '19'], ['Sex', '20'], ['Sáb', '21'], ['Dom', '22']]
      .map(([wd, d]) => ({ wd, d, on: d === '20', off: d !== '20' }));
    const hours = [];
    for (let h = 8; h <= 18; h++) hours.push(String(h).padStart(2, '0') + ':00');
    return { strip, hours };
  }
}
</script>
</body>
</html>
