<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LOMA — Financeiro, gastos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17165C}a:hover{color:#0B0A3A}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2FA; color: #17165C; font-family: 'Outfit', system-ui, sans-serif; position: relative; overflow: hidden">
  <h1 style="margin: 0; padding: 18px 20px 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Financeiro</h1>

  <nav aria-label="Seções do financeiro" style="display: flex; gap: 4px; margin: 10px 16px 0; padding: 4px; background: #E7E4F8; border-radius: 24px">
    <a href="T-Fin-Geral.dc.html" style="flex: 1.2; height: 38px; border-radius: 19px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Visão Geral</a>
    <a href="T-Fin-Ganhos.dc.html" style="flex: 1; height: 38px; border-radius: 19px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Ganhos</a>
    <a href="T-Fin-Gastos.dc.html" aria-current="page" style="flex: 1; height: 38px; border-radius: 19px; background: #17165C; color: #5ED6B4; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Gastos</a>
  </nav>

  <section aria-label="Resumo de novembro" style="margin: 12px 16px 0; border-radius: 24px; background: #FFFFFF; padding: 14px 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 12.5px; font-weight: 600; color: #5B5A7A">Total pago</span><span style="font-size: 22px; font-weight: 800">R$ 1.420</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 12.5px; font-weight: 600; color: #5B5A7A">Contas a vencer no mês</span><span style="font-size: 22px; font-weight: 800; color: #B3321E">R$ 180</span></div>
    </div>
    <div role="img" aria-label="89% dos gastos do mês já pagos" style="margin-top: 10px; height: 10px; border-radius: 5px; background: #FFE2DC; overflow: hidden">
      <div style="width: 89%; height: 100%; border-radius: 5px; background: #17165C"></div>
    </div>
  </section>

  <h2 style="margin: 0; padding: 14px 20px 8px; font-size: 17px; font-weight: 800">Contas fixas do salão</h2>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
    <sc-for list="{{fixed}}" as="c" hint-placeholder-count="4">
      <div style="border-radius: 18px; background: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #E7E4F8; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17165C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">{{c.name}} <span style="font-weight: 800">· {{c.v}}</span></span>
          <span style="font-size: 12.5px; color: #5B5A7A">{{c.sub}}</span>
        </span>
        <sc-if value="{{c.paid}}" hint-placeholder-val="{{true}}">
          <button aria-label="Status: pago. Tocar para marcar como pendente" style="height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: #5ED6B4; color: #0B3A2E; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; cursor: pointer">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Pago</button>
        </sc-if>
        <sc-if value="{{c.pending}}" hint-placeholder-val="{{false}}">
          <button aria-label="Status: pendente. Tocar para marcar como pago" style="height: 30px; padding: 0 10px; border: 1.5px solid #D9472E; border-radius: 15px; background: #FFF4F1; color: #9E2A16; font-size: 12px; font-weight: 800; cursor: pointer">Pendente</button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <h2 style="margin: 0; padding: 14px 20px 8px; font-size: 17px; font-weight: 800">Materiais</h2>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
    <sc-for list="{{mats}}" as="m" hint-placeholder-count="2">
      <div style="border-radius: 18px; background: #FFFFFF; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: #E3F8F1; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B3A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v4l-4 5v8a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8l-4-5V3"/></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 15px; font-weight: 700">{{m.name}}</span>
          <span style="font-size: 12.5px; color: #5B5A7A">{{m.sub}}</span>
        </span>
        <span style="font-size: 16px; font-weight: 800">{{m.v}}</span>
      </div>
    </sc-for>
  </div>

  <button style="position: absolute; right: 16px; bottom: 98px; height: 56px; padding: 0 20px; border: 0; border-radius: 22px; background: #17165C; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 20px rgba(23,22,92,0.3); cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5ED6B4" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Novo gasto
  </button>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -4px 20px rgba(23,22,92,0.07); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 6px 16px; box-sizing: border-box">
    <a href="T-Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Início</span>
    </a>
    <a href="T-Agenda.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Agenda</span>
    </a>
    <a href="T-Cliente.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #5B5A7A">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg></span>
      <span style="font-size: 12px; font-weight: 600">Clientes</span>
    </a>
    <a href="T-Fin-Geral.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #17165C">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #17165C; color: #5ED6B4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg></span>
      <span style="font-size: 12px; font-weight: 700">Financeiro</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      casa: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',
      luz: 'M13 3L5 14h6l-1 7 8-11h-6z',
      agua: 'M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z',
      net: 'M3 9a14 14 0 0 1 18 0M6 12.5a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 19h.01'
    };
    const fixed = [
      { icon: I.casa, name: 'Aluguel (minha parte)', v: 'R$ 900', sub: 'Venceu 10/11 · fixa mensal', paid: true, pending: false },
      { icon: I.luz, name: 'Energia', v: 'R$ 180', sub: 'Venceu 15/11 · fixa mensal', paid: true, pending: false },
      { icon: I.agua, name: 'Água', v: 'R$ 60', sub: 'Vence amanhã, 21/11 · fixa mensal', paid: false, pending: true },
      { icon: I.net, name: 'Internet', v: 'R$ 120', sub: 'Vence amanhã, 21/11 · fixa mensal', paid: false, pending: true }
    ];
    const mats = [
      { name: 'Tintas e oxidantes', sub: '12/11 · Produtos', v: 'R$ 240' },
      { name: 'Luvas e toalhas descartáveis', sub: '05/11 · Descartáveis', v: 'R$ 100' }
    ];
    return { fixed, mats };
  }
}
</script>
</body>
</html>
