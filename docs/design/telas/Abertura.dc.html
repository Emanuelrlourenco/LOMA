<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LOMA — Abertura animada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
@keyframes lomaGlow{0%{opacity:0;transform:scale(.3)}70%{opacity:.55;transform:scale(1)}80%{opacity:.75;transform:scale(1.15)}100%{opacity:.25;transform:scale(1.05)}}
@keyframes lomaFloat{0%{opacity:0;transform:translateY(20px)}50%{opacity:.85}100%{opacity:0;transform:translateY(-44px)}}
@keyframes lomaDotIn{0%{opacity:0;transform:scale(0)}64%{opacity:1;transform:scale(.6)}79%{transform:scale(1.35)}100%{opacity:1;transform:scale(1)}}
@keyframes lomaDotToO{0%{transform:translateX(0) scale(1);opacity:1}100%{transform:translateX(-36px) scale(1.6);opacity:0}}
@keyframes lomaOIn{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes lomaRing{0%{transform:scale(.3);opacity:.9}100%{transform:scale(4);opacity:0}}
@keyframes lomaUp{0%{transform:translateY(22px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes lomaShine{0%{transform:translateX(-160px) skewX(-20deg)}100%{transform:translateX(260px) skewX(-20deg)}}
@keyframes lomaExit{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92)}}
@keyframes lomaFade{0%{opacity:1}100%{opacity:0}}
@keyframes lomaShow{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F2FA; color: #17165C; font-family: 'Outfit', system-ui, sans-serif; position: relative; overflow: hidden">

  <sc-if value="{{runA}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0">
      <div aria-hidden="true" style="position: absolute; left: 24px; top: 40px; display: flex; flex-direction: column; animation: lomaShow 400ms ease-out 4250ms both">
        <span style="font-size: 24px">Bom dia,</span>
        <span style="font-size: 32px; font-weight: 800">Carla</span>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: #17165C; animation: lomaFade 450ms ease-in 4100ms both"></div>
      <div role="img" aria-label="Abertura do LOMA: o ponto menta vira o o do nome loma" style="position: absolute; left: 0; right: 0; top: 0; height: 844px; animation: lomaExit 450ms ease-in 4000ms both">
        <span aria-hidden="true" style="position: absolute; left: 115px; top: 270px; width: 160px; height: 160px; border-radius: 80px; background: #5ED6B4; filter: blur(44px); animation: lomaGlow 3000ms ease-in 0ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 150px; top: 420px; width: 5px; height: 5px; border-radius: 3px; background: #5ED6B4; animation: lomaFloat 1700ms ease-out 200ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 238px; top: 400px; width: 4px; height: 4px; border-radius: 2px; background: #B69CF2; animation: lomaFloat 1700ms ease-out 500ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 178px; top: 440px; width: 3px; height: 3px; border-radius: 2px; background: #FFFFFF; animation: lomaFloat 1600ms ease-out 800ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 214px; top: 430px; width: 5px; height: 5px; border-radius: 3px; background: #5ED6B4; animation: lomaFloat 1500ms ease-out 1050ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 132px; top: 405px; width: 4px; height: 4px; border-radius: 2px; background: #B69CF2; animation: lomaFloat 1400ms ease-out 1300ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 165px; top: 320px; width: 60px; height: 60px; border-radius: 30px; border: 3px solid #5ED6B4; box-sizing: border-box; animation: lomaRing 900ms ease-out 2100ms both"></span>
        <div style="position: absolute; left: 0; right: 0; top: 304px; display: flex; justify-content: center; align-items: baseline">
          <div style="position: relative; display: flex; align-items: baseline; overflow: hidden; padding: 0 4px">
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2350ms both">l</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #5ED6B4; display: inline-block; animation: lomaOIn 380ms ease-out 2520ms both">o</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2650ms both">m</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2800ms both">a</span>
            <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 40px; background: rgba(255,255,255,0.35); animation: lomaShine 600ms ease-in-out 3300ms both"></span>
          </div>
        </div>
        <span aria-hidden="true" style="position: absolute; left: 184px; top: 339px; width: 22px; height: 22px; animation: lomaDotToO 420ms ease-in 2380ms both">
          <span style="display: block; width: 22px; height: 22px; border-radius: 11px; background: #5ED6B4; animation: lomaDotIn 950ms cubic-bezier(.2,.9,.3,1.3) 1400ms both"></span>
        </span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{runB}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0">
      <div aria-hidden="true" style="position: absolute; left: 24px; top: 40px; display: flex; flex-direction: column; animation: lomaShow 400ms ease-out 4250ms both">
        <span style="font-size: 24px">Bom dia,</span>
        <span style="font-size: 32px; font-weight: 800">Carla</span>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: #17165C; animation: lomaFade 450ms ease-in 4100ms both"></div>
      <div role="img" aria-label="Abertura do LOMA: o ponto menta vira o o do nome loma" style="position: absolute; left: 0; right: 0; top: 0; height: 844px; animation: lomaExit 450ms ease-in 4000ms both">
        <span aria-hidden="true" style="position: absolute; left: 115px; top: 270px; width: 160px; height: 160px; border-radius: 80px; background: #5ED6B4; filter: blur(44px); animation: lomaGlow 3000ms ease-in 0ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 150px; top: 420px; width: 5px; height: 5px; border-radius: 3px; background: #5ED6B4; animation: lomaFloat 1700ms ease-out 200ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 238px; top: 400px; width: 4px; height: 4px; border-radius: 2px; background: #B69CF2; animation: lomaFloat 1700ms ease-out 500ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 178px; top: 440px; width: 3px; height: 3px; border-radius: 2px; background: #FFFFFF; animation: lomaFloat 1600ms ease-out 800ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 214px; top: 430px; width: 5px; height: 5px; border-radius: 3px; background: #5ED6B4; animation: lomaFloat 1500ms ease-out 1050ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 132px; top: 405px; width: 4px; height: 4px; border-radius: 2px; background: #B69CF2; animation: lomaFloat 1400ms ease-out 1300ms both"></span>
        <span aria-hidden="true" style="position: absolute; left: 165px; top: 320px; width: 60px; height: 60px; border-radius: 30px; border: 3px solid #5ED6B4; box-sizing: border-box; animation: lomaRing 900ms ease-out 2100ms both"></span>
        <div style="position: absolute; left: 0; right: 0; top: 304px; display: flex; justify-content: center; align-items: baseline">
          <div style="position: relative; display: flex; align-items: baseline; overflow: hidden; padding: 0 4px">
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2350ms both">l</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #5ED6B4; display: inline-block; animation: lomaOIn 380ms ease-out 2520ms both">o</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2650ms both">m</span>
            <span style="font-size: 64px; line-height: 1.2; font-weight: 800; letter-spacing: -1.6px; color: #FFFFFF; animation: lomaUp 420ms ease-out 2800ms both">a</span>
            <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 40px; background: rgba(255,255,255,0.35); animation: lomaShine 600ms ease-in-out 3300ms both"></span>
          </div>
        </div>
        <span aria-hidden="true" style="position: absolute; left: 184px; top: 339px; width: 22px; height: 22px; animation: lomaDotToO 420ms ease-in 2380ms both">
          <span style="display: block; width: 22px; height: 22px; border-radius: 11px; background: #5ED6B4; animation: lomaDotIn 950ms cubic-bezier(.2,.9,.3,1.3) 1400ms both"></span>
        </span>
      </div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; border-radius: 26px; background: #FFFFFF; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(8,8,40,0.25)">
    <button onClick="{{play}}" style="height: 52px; border: 0; border-radius: 26px; background: #17165C; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#5ED6B4" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
      Ver a abertura (4,6 s)
    </button>
    <div role="group" aria-label="Som da abertura" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{sons}}" as="s" hint-placeholder-count="2">
        <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
          <button aria-pressed="true" onClick="{{s.pick}}" style="height: 40px; border: 0; border-radius: 20px; background: #B69CF2; font-size: 14px; font-weight: 800; cursor: pointer">{{s.label}}</button>
        </sc-if>
        <sc-if value="{{s.off}}" hint-placeholder-val="{{true}}">
          <button aria-pressed="false" onClick="{{s.pick}}" style="height: 40px; border: 1.5px solid #C9C6E6; border-radius: 20px; background: transparent; font-size: 14px; font-weight: 600; cursor: pointer">{{s.label}}</button>
        </sc-if>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { run: 0, som: 'brilho' };
  }
  renderVals() {
    const urls = { brilho: '/_blob/3f068f1f98112043f18c6a93f0c017c6' };
    const som = this.state.som;
    const sons = [['brilho', 'Brilho lento'], ['sem', 'Sem som']].map(([id, label]) => ({
      label, on: id === som, off: id !== som,
      pick: () => this.setState({ som: id })
    }));
    const play = () => {
      this.setState({ run: this.state.run + 1 });
      const url = urls[this.state.som];
      if (url) {
        try { const a = new Audio(url); a.volume = 0.9; a.play().catch(() => {}); } catch (e) {}
      }
    };
    return { sons, play, runA: this.state.run % 2 === 0, runB: this.state.run % 2 === 1 };
  }
}
</script>
</body>
</html>
