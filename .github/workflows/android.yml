name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cabeçalhos de licença
        run: tools/ci/check-spdx.sh .
      - name: Autoteste do verificador de cabeçalhos
        run: "! tools/ci/check-spdx.sh tools/ci/fixtures/spdx"
      - name: Configuração do projeto
        run: ./gradlew --stacktrace help
      - name: Testes (JVM)
        run: ./gradlew --stacktrace --continue :shared:salon:jvmTest :shared:data:jvmTest :shared:ui:jvmTest :shared:ui:compileAndroidMain :androidApp:testDebugUnitTest :androidApp:assembleDebug
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: "**/build/reports/tests/"
      - name: APK de depuração
        run: ls -la androidApp/build/outputs/apk/debug/
      - name: Capturas de tela (Roborazzi)
        run: ./gradlew :shared:ui:recordRoborazziJvm
      - name: Capturas no log (para revisão)
        run: |
          for f in shared/ui/screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "::group::PNG $f"; echo "===PNG-BEGIN $f==="; base64 -w0 "$f"; echo; echo "===PNG-END==="; echo "::endgroup::"
          done
      - name: Schema do banco (para versionar)
        if: always()
        run: |
          find shared/data/schemas -name '*.json' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            echo "::group::SCHEMA $f"; echo "===SCHEMA-BEGIN $f==="; base64 -w0 "$f"; echo; echo "===SCHEMA-END==="; echo "::endgroup::"
          done
