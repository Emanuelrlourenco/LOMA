name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cabeçalhos de licença
        run: tools/ci/check-spdx.sh .
      - name: Autoteste do verificador de cabeçalhos
        run: "! tools/ci/check-spdx.sh tools/ci/fixtures/spdx"
      - name: Configuração do projeto
        run: ./gradlew --stacktrace help
      - name: Testes (JVM)
        run: ./gradlew --stacktrace --continue :shared:salon:jvmTest :shared:data:jvmTest :shared:ui:jvmTest
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: "**/build/reports/tests/"
      - name: Schema do banco (para versionar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: shared/data/schemas/
          if-no-files-found: ignore
